name: Site bug
description: Something on the site doesn't work or looks broken.
labels: [bug, triage]
body:
  - type: input
    id: page
    attributes:
      label: Page
      placeholder: https://jhermesn.dev/easyreview/
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: What happened
      description: What you did, what you expected and what you saw instead. A screenshot helps.
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Browser and device
      placeholder: Firefox 140 on Android, Safari on macOS...
