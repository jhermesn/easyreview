name: CI

# Every pull request: section lint, card ids kept, unit tests, a full build and a browser smoke test.
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Section lint
        run: npm run lint
      - name: Card ids kept
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node scripts/check-card-ids.mjs "$BASE_SHA"
      - name: Unit tests
        run: npm test
      - name: Build
        env:
          GH_TOKEN: ${{ github.token }}
        run: npm run build
      - name: Smoke test
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e
